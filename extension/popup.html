<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body {
    width: 280px; margin: 0; padding: 14px;
    font-size: 14px; line-height: 1.6;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2937;
  }
  h1 { font-size: 17px; margin: 0 0 6px; }
  .hint { font-size: 12px; color: #6b7280; margin: 0 0 10px; }
  button {
    width: 100%; min-height: 44px; font-size: 15px; border: 0;
    border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  #status { margin-top: 10px; font-size: 13px; color: #2563eb; min-height: 18px; word-break: break-all; }
  #status.err { color: #dc2626; }
</style>
</head>
<body>
  <h1>🔍 真评</h1>
  <p class="hint">在当前天猫/淘宝商品页旁听评价数据，收集完自动打开报告页（需本地服务已启动）。</p>
  <button id="go">开始分析</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
